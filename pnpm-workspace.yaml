allowBuilds:
  esbuild: false
  spawn-sync: false
catalog:
  # Keep Vite+, its core alias, and the Vitest override on matching toolchain versions.
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: 'catalog:'
  vitest@*: 5.0.5
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
